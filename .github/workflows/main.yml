name: OrangeFox CI (SM-N9005)

on:
  workflow_dispatch:
jobs:
  build:
    name: LineageOS Build CI
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
    - name: Check Out
      uses: actions/checkout@v7
    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main
    - name: Installing JDK 7 + Build Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository ppa:deadsnakes/ppa
        sudo add-apt-repository universe
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex axel g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick protobuf-compiler python3-protobuf lib32readline-dev lib32z1-dev libdw-dev libelf-dev lz4 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
        wget https://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2_amd64.deb && sudo dpkg -i libtinfo5_6.3-2_amd64.deb && rm -f libtinfo5_6.3-2_amd64.deb
        wget https://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.3-2_amd64.deb && sudo dpkg -i libncurses5_6.3-2_amd64.deb && rm -f libncurses5_6.3-2_amd64.deb
        cd /usr/local/src
        sudo wget https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
        sudo tar xvf Python-2.7.18.tgz
        cd Python-2.7.18
        sudo ./configure --enable-optimizations
        sudo make altinstall
        sudo ln -sf /usr/local/bin/python2.7 /usr/bin/python2
        sudo ln -sf /usr/local/bin/python2.7 /usr/bin/python
    - name: Install OpenJDK
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '8'
    - name: Syncing OFRP sources
      run: |
        mkdir ~/OFRP
        cd ~/OFRP
        mkdir ~/.bin
        curl http://commondatastorage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
        python3 ~/.bin/repo init --depth=1 -u https://github.com/unlegacy-devices/fox-7.1_manifest -b twrp-7.1
        git clone --branch fox-7.1 --single-branch https://github.com/NotNoelChannel/twrp_device_samsung_hlte.git ~/OFRP/device/samsung/hlte
        git clone --depth=1 --branch android-7.1.2_r38 --single-branch https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-eabi-4.8 /opt/toolchains/arm-eabi-4.8
        git clone --branch cm-14.1 --single-branch https://github.com/LineageOS/android_kernel_samsung_msm8974.git ~/OFRP/kernel/samsung/msm8974
        python3 ~/.bin/repo sync -c --force-sync --optimized-fetch --no-tags --no-clone-bundle --prune -j$(nproc --all)
    - name: Building OFRP
      run: |
        cd ~/OFRP
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        export TARGET_ARCH=arm
        export FOX_RECOVERY_INSTALL_PARTITION=/dev/block/platform/msm_sdcc.1/by-name/recovery
        export FOX_RECOVERY_SYSTEM_PARTITION=/dev/block/platform/msm_sdcc.1/by-name/system
        export TW_DEFAULT_LANGUAGE="en"
        export OF_VANILLA_BUILD=1
        export OF_SKIP_ORANGEFOX_PROCESS=1
        export OF_DISABLE_MIUI_SPECIFIC_FEATURES=1
        export OF_DONT_PATCH_ON_FRESH_INSTALLATION=1
        export OF_NO_TREBLE_COMPATIBILITY_CHECK=1
        export OF_DONT_PATCH_ENCRYPTED_DEVICE=1	
        export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
        export OF_USE_MAGISKBOOT=1
        export OF_USE_MAGISKBOOT_FOR_ALL_PATCHES=1
        export OF_USE_TWRP_SAR_DETECT=0
        export OF_FLASHLIGHT_ENABLE=0
        export OF_DEVICE_WITHOUT_PERSIST=1
        export OF_DISABLE_EXTRA_ABOUT_PAGE=1
        lunch omni_hlte-eng
        make -j$(nproc --all) recoveryimage
        export PATH=$OLDPATH
        export JAVA_HOME=$OLDJAVAHOME
    - name: Uploading OFRP builds
      uses: actions/upload-artifact@v4
      with:
        name: ofrp
        path: | 
          /home/runner/OFRP/out/target/product/hlte/recovery.*
          /home/runner/OFRP/out/target/product/hlte/OrangeFox-*.zip
